<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build a House — Bidding Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 60%, #90C695 60%, #6B8E5A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      padding-bottom: 40px;
    }

    h1 {
      margin-top: 16px;
      color: #2c3e50;
      font-size: 1.7rem;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
    }

    .instructions {
      color: #34495e;
      margin: 4px 16px 10px;
      font-size: 0.85rem;
      text-align: center;
      max-width: 400px;
      line-height: 1.4;
    }

    /* === Budget bar === */
    .budget-bar {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 10px;
      padding: 10px 16px;
      margin: 0 16px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .budget-track {
      width: 100%;
      height: 14px;
      background: #ecf0f1;
      border-radius: 7px;
      overflow: hidden;
    }

    .budget-fill {
      height: 100%;
      border-radius: 7px;
      background: #27ae60;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .budget-fill.warning { background: #f39c12; }
    .budget-fill.over { background: #e74c3c; }

    .budget-remaining {
      text-align: right;
      font-size: 0.75rem;
      color: #7f8c8d;
      margin-top: 4px;
    }

    /* === Stack (built house) === */
    .stack {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 4px 16px;
      gap: 3px;
      min-height: 20px;
    }

    .ground-line {
      width: 100%;
      max-width: 360px;
      height: 4px;
      background: #6B4226;
      border-radius: 2px;
      margin-bottom: 10px;
    }

    .stacked-block {
      width: 100%;
      max-width: 360px;
      padding: 7px 12px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 0.75rem;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      border: 2px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease;
    }

    .stacked-block .tier-badge {
      font-size: 0.65rem;
      background: rgba(0,0,0,0.2);
      padding: 2px 8px;
      border-radius: 10px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === Current trade bidding === */
    .bid-section {
      width: 100%;
      max-width: 380px;
      padding: 0 16px;
      margin-top: 8px;
    }

    .trade-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 8px;
    }

    .trade-step {
      font-size: 0.75rem;
      color: #7f8c8d;
      font-weight: 400;
    }

    .bid-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bid-card {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid rgba(0,0,0,0.08);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bid-card:active { transform: scale(0.98); }
    .bid-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.15); }

    .bid-card.low { background: #f0f4f0; }
    .bid-card.med { background: #eef2f7; }
    .bid-card.high { background: #fdf2ec; }

    .bid-card.low:hover { border-color: #27ae60; }
    .bid-card.med:hover { border-color: #3498db; }
    .bid-card.high:hover { border-color: #e67e22; }

    .bid-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bid-tier {
      font-weight: 700;
      font-size: 0.85rem;
      color: #2c3e50;
    }

    .bid-desc {
      font-size: 0.75rem;
      color: #666;
      line-height: 1.3;
    }

    .bid-price {
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
      margin-left: 12px;
    }

    .bid-card.low .bid-price { color: #27ae60; }
    .bid-card.med .bid-price { color: #2980b9; }
    .bid-card.high .bid-price { color: #d35400; }

    /* === Results === */
    .results {
      display: none;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      text-align: center;
    }

    .results.show { display: block; }

    .results h2 {
      color: #2c3e50;
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 4px;
    }

    .result-summary {
      font-size: 0.9rem;
      color: #34495e;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .quality-bar {
      width: 100%;
      height: 18px;
      background: #ecf0f1;
      border-radius: 9px;
      overflow: hidden;
      margin: 6px 0;
    }

    .quality-fill {
      height: 100%;
      border-radius: 9px;
      transition: width 0.6s ease;
    }

    .quality-label {
      font-size: 0.8rem;
      color: #7f8c8d;
      margin-bottom: 10px;
    }

    .breakdown {
      text-align: left;
      font-size: 0.75rem;
      color: #555;
      margin-top: 12px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }

    .breakdown-row .tier-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .tier-dot.low { background: #27ae60; }
    .tier-dot.med { background: #3498db; }
    .tier-dot.high { background: #e67e22; }

    /* === Buttons === */
    button {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-reset { background: #e67e22; color: #fff; margin-top: 12px; }
    .btn-reset:hover { background: #cf6d17; }
  </style>
</head>
<body>

<h1>Build a House</h1>
<p class="instructions">
  You have a budget to build a house. For each trade, pick a low, standard, or
  premium bid. Spend wisely — stay under budget while building the best home you can!
</p>

<div class="budget-bar">
  <div class="budget-header">
    <span id="spent">Spent: $0</span>
    <span id="budgetTotal">Budget: $250,000</span>
  </div>
  <div class="budget-track">
    <div class="budget-fill" id="budgetFill" style="width: 0%"></div>
  </div>
  <div class="budget-remaining" id="remaining">$250,000 remaining</div>
</div>

<div class="stack" id="stack"></div>
<div class="ground-line"></div>

<div class="bid-section" id="bidSection"></div>

<div class="results" id="results"></div>

<script>
  const BUDGET = 250000;

  const TRADES = [
    {
      name: "Site Preparation & Excavation", color: "#8B6914", icon: "\u{1F6DC}",
      bids: [
        { tier: "Budget", price: 8000,  desc: "Basic clearing, minimal grading" },
        { tier: "Standard", price: 15000, desc: "Full grading, soil testing, proper drainage" },
        { tier: "Premium", price: 25000,  desc: "Engineered site plan, tree preservation, retaining walls" },
      ]
    },
    {
      name: "Foundation & Concrete", color: "#7F8C8D", icon: "\u{1F9F1}",
      bids: [
        { tier: "Budget", price: 15000, desc: "Basic slab-on-grade foundation" },
        { tier: "Standard", price: 25000, desc: "Reinforced slab with moisture barrier" },
        { tier: "Premium", price: 42000, desc: "Full basement with waterproofing and drainage" },
      ]
    },
    {
      name: "Framing", color: "#C0792A", icon: "\u{1FA9A}",
      bids: [
        { tier: "Budget", price: 20000, desc: "Standard lumber, basic roof trusses" },
        { tier: "Standard", price: 35000, desc: "Engineered lumber, raised ceilings" },
        { tier: "Premium", price: 52000, desc: "Steel-reinforced, open floor plan, vaulted ceilings" },
      ]
    },
    {
      name: "Roofing", color: "#6C3483", icon: "\u{1F3E0}",
      bids: [
        { tier: "Budget", price: 7000,  desc: "3-tab asphalt shingles, 20-year warranty" },
        { tier: "Standard", price: 14000, desc: "Architectural shingles, 30-year warranty" },
        { tier: "Premium", price: 28000, desc: "Standing seam metal roof, 50-year warranty" },
      ]
    },
    {
      name: "Windows & Exterior Doors", color: "#2980B9", icon: "\u{1FA9F}",
      bids: [
        { tier: "Budget", price: 6000,  desc: "Single-pane vinyl, builder-grade doors" },
        { tier: "Standard", price: 14000, desc: "Double-pane low-E, fiberglass entry door" },
        { tier: "Premium", price: 26000, desc: "Triple-pane, custom sizes, solid wood entry" },
      ]
    },
    {
      name: "Plumbing Rough-In", color: "#1ABC9C", icon: "\u{1F6BF}",
      bids: [
        { tier: "Budget", price: 8000,  desc: "PVC supply lines, basic fixture layout" },
        { tier: "Standard", price: 15000, desc: "PEX piping, standard fixture prep, hose bibs" },
        { tier: "Premium", price: 24000, desc: "PEX with manifold, recirculating hot water, gas lines" },
      ]
    },
    {
      name: "Electrical Rough-In", color: "#F39C12", icon: "\u26A1",
      bids: [
        { tier: "Budget", price: 7000,  desc: "Code-minimum outlets, basic 100-amp panel" },
        { tier: "Standard", price: 13000, desc: "200-amp panel, USB outlets, wired for ceiling fans" },
        { tier: "Premium", price: 22000, desc: "Smart panel, pre-wired for EV charger, whole-home surge" },
      ]
    },
    {
      name: "HVAC", color: "#5DADE2", icon: "\u2744\uFE0F",
      bids: [
        { tier: "Budget", price: 6000,  desc: "Basic single-stage furnace and AC" },
        { tier: "Standard", price: 13000, desc: "Two-stage system, programmable thermostat, zoned" },
        { tier: "Premium", price: 24000, desc: "Variable-speed heat pump, smart thermostat, dual-zone" },
      ]
    },
    {
      name: "Insulation", color: "#E91E8B", icon: "\u{1F9E4}",
      bids: [
        { tier: "Budget", price: 3000,  desc: "Fiberglass batts, code-minimum R-value" },
        { tier: "Standard", price: 6500,  desc: "Blown-in fiberglass, improved R-value, air sealing" },
        { tier: "Premium", price: 14000, desc: "Closed-cell spray foam, exceeds code, air-tight" },
      ]
    },
    {
      name: "Drywall", color: "#BDC3C7", icon: "\u{1F9F1}",
      bids: [
        { tier: "Budget", price: 7000,  desc: "Standard drywall, level 3 finish" },
        { tier: "Standard", price: 11000, desc: "Moisture-resistant in baths, level 4 finish" },
        { tier: "Premium", price: 18000, desc: "Soundproof drywall, level 5 finish throughout" },
      ]
    },
    {
      name: "Interior Finishes & Paint", color: "#E74C3C", icon: "\u{1F3A8}",
      bids: [
        { tier: "Budget", price: 8000,  desc: "Builder-grade trim, flat paint, basic hardware" },
        { tier: "Standard", price: 18000, desc: "Craftsman trim, satin paint, brushed nickel hardware" },
        { tier: "Premium", price: 35000, desc: "Custom millwork, designer paint, premium fixtures" },
      ]
    },
    {
      name: "Flooring", color: "#AF601A", icon: "\u{1FA9A}",
      bids: [
        { tier: "Budget", price: 5000,  desc: "Vinyl plank and basic carpet" },
        { tier: "Standard", price: 13000, desc: "LVP throughout, tile in wet areas, upgraded carpet" },
        { tier: "Premium", price: 26000, desc: "Hardwood floors, porcelain tile, heated bath floors" },
      ]
    },
    {
      name: "Cabinets & Countertops", color: "#884EA0", icon: "\u{1F5C4}\uFE0F",
      bids: [
        { tier: "Budget", price: 8000,  desc: "Stock cabinets, laminate countertops" },
        { tier: "Standard", price: 18000, desc: "Semi-custom cabinets, quartz countertops" },
        { tier: "Premium", price: 38000, desc: "Custom cabinetry, waterfall island, premium stone" },
      ]
    },
    {
      name: "Final Plumbing & Electrical", color: "#17A589", icon: "\u{1F4A1}",
      bids: [
        { tier: "Budget", price: 5000,  desc: "Builder-grade fixtures, basic lighting" },
        { tier: "Standard", price: 11000, desc: "Quality fixtures, recessed lighting, dimmer switches" },
        { tier: "Premium", price: 22000, desc: "Designer fixtures, smart lighting, steam shower" },
      ]
    },
    {
      name: "Landscaping & Exterior", color: "#27AE60", icon: "\u{1F333}",
      bids: [
        { tier: "Budget", price: 5000,  desc: "Basic sod, gravel driveway, no fence" },
        { tier: "Standard", price: 15000, desc: "Lawn, concrete driveway, patio, basic planting" },
        { tier: "Premium", price: 32000, desc: "Designed landscape, pavers, deck, irrigation, fencing" },
      ]
    },
  ];

  let currentStep = 0;
  let totalSpent = 0;
  let selections = [];

  function formatMoney(n) {
    return "$" + n.toLocaleString();
  }

  function updateBudgetBar() {
    const pct = Math.min((totalSpent / BUDGET) * 100, 100);
    const fill = document.getElementById("budgetFill");
    fill.style.width = pct + "%";
    fill.className = "budget-fill";
    if (totalSpent > BUDGET) fill.classList.add("over");
    else if (pct > 75) fill.classList.add("warning");

    document.getElementById("spent").textContent = "Spent: " + formatMoney(totalSpent);
    const left = BUDGET - totalSpent;
    document.getElementById("remaining").textContent = left >= 0
      ? formatMoney(left) + " remaining"
      : formatMoney(Math.abs(left)) + " OVER BUDGET";
    document.getElementById("remaining").style.color = left >= 0 ? "#7f8c8d" : "#e74c3c";
  }

  function addStackBlock(trade, bid) {
    const el = document.createElement("div");
    el.className = "stacked-block";
    el.style.background = trade.color;

    const tierClass = bid.tier === "Budget" ? "low" : bid.tier === "Standard" ? "med" : "high";
    el.innerHTML = `
      <span><span class="block-icon">${trade.icon}</span> ${trade.name}</span>
      <span class="tier-badge">${bid.tier} ${formatMoney(bid.price)}</span>
    `;
    document.getElementById("stack").appendChild(el);
  }

  function showCurrentTrade() {
    const section = document.getElementById("bidSection");

    if (currentStep >= TRADES.length) {
      section.innerHTML = "";
      showResults();
      return;
    }

    const trade = TRADES[currentStep];
    section.innerHTML = `
      <div class="trade-label">
        ${trade.icon} ${trade.name}
        <div class="trade-step">Trade ${currentStep + 1} of ${TRADES.length}</div>
      </div>
      <div class="bid-options">
        ${trade.bids.map((bid, i) => {
          const tierClass = i === 0 ? "low" : i === 1 ? "med" : "high";
          return `
            <div class="bid-card ${tierClass}" onclick="selectBid(${i})">
              <div class="bid-info">
                <div class="bid-tier">${bid.tier}</div>
                <div class="bid-desc">${bid.desc}</div>
              </div>
              <div class="bid-price">${formatMoney(bid.price)}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function selectBid(bidIndex) {
    const trade = TRADES[currentStep];
    const bid = trade.bids[bidIndex];

    totalSpent += bid.price;
    selections.push({ trade, bid, bidIndex });

    updateBudgetBar();
    addStackBlock(trade, bid);

    currentStep++;
    showCurrentTrade();
  }

  function showResults() {
    const results = document.getElementById("results");
    const underBudget = totalSpent <= BUDGET;

    // Quality score: 0 for budget, 1 for standard, 2 for premium
    const qualityPoints = selections.reduce((sum, s) => sum + s.bidIndex, 0);
    const maxPoints = TRADES.length * 2;
    const qualityPct = Math.round((qualityPoints / maxPoints) * 100);

    let qualityColor, qualityLabel, icon, message;
    if (qualityPct >= 75) {
      qualityColor = "#e67e22"; qualityLabel = "Luxury Build";
      icon = "\u{1F3F0}"; message = "Top-of-the-line finishes throughout!";
    } else if (qualityPct >= 50) {
      qualityColor = "#3498db"; qualityLabel = "Quality Build";
      icon = "\u{1F3E1}"; message = "A well-built home with great features.";
    } else if (qualityPct >= 25) {
      qualityColor = "#27ae60"; qualityLabel = "Solid Build";
      icon = "\u{1F3E0}"; message = "A practical home that gets the job done.";
    } else {
      qualityColor = "#95a5a6"; qualityLabel = "Basic Build";
      icon = "\u{1F3DA}\uFE0F"; message = "It's a roof over your head!";
    }

    const budgetMsg = underBudget
      ? `You came in at <strong>${formatMoney(totalSpent)}</strong> — <strong>${formatMoney(BUDGET - totalSpent)}</strong> under budget!`
      : `You spent <strong>${formatMoney(totalSpent)}</strong> — <strong style="color:#e74c3c">${formatMoney(totalSpent - BUDGET)} over budget!</strong>`;

    let breakdownHTML = selections.map(s => {
      const tierClass = s.bidIndex === 0 ? "low" : s.bidIndex === 1 ? "med" : "high";
      return `
        <div class="breakdown-row">
          <span><span class="tier-dot ${tierClass}"></span>${s.trade.icon} ${s.trade.name}</span>
          <span>${s.bid.tier} — ${formatMoney(s.bid.price)}</span>
        </div>
      `;
    }).join("");

    results.innerHTML = `
      <div class="result-icon">${icon}</div>
      <h2>${underBudget ? "Build Complete!" : "Over Budget!"}</h2>
      <div class="result-summary">${message}<br>${budgetMsg}</div>
      <div class="quality-label">Build Quality: ${qualityPct}% — ${qualityLabel}</div>
      <div class="quality-bar">
        <div class="quality-fill" style="width: ${qualityPct}%; background: ${qualityColor}"></div>
      </div>
      <div class="breakdown">
        <strong>Cost Breakdown</strong>
        ${breakdownHTML}
        <div class="breakdown-row" style="font-weight:700; border-top: 2px solid #ccc; margin-top:4px; padding-top:6px;">
          <span>Total</span>
          <span>${formatMoney(totalSpent)}</span>
        </div>
      </div>
      <button class="btn-reset" onclick="resetGame()">Play Again</button>
    `;
    results.classList.add("show");
  }

  function resetGame() {
    currentStep = 0;
    totalSpent = 0;
    selections = [];
    document.getElementById("stack").innerHTML = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("results").classList.remove("show");
    updateBudgetBar();
    showCurrentTrade();
  }

  // Start
  updateBudgetBar();
  showCurrentTrade();
</script>

</body>
</html>
