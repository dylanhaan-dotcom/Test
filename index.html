<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build a House — Block Stacking Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 60%, #90C695 60%, #6B8E5A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      padding-bottom: 40px;
    }

    h1 {
      margin-top: 20px;
      color: #2c3e50;
      font-size: 1.8rem;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
    }

    .instructions {
      color: #34495e;
      margin: 6px 16px 12px;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
      line-height: 1.4;
    }

    /* === Stack area === */
    .stack {
      width: 100%;
      max-width: 360px;
      min-height: 60px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 8px 16px;
      gap: 4px;
      margin-bottom: 8px;
    }

    .ground-line {
      width: 100%;
      max-width: 340px;
      height: 4px;
      background: #6B4226;
      border-radius: 2px;
    }

    /* === Available blocks === */
    .available {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
    }

    /* === Blocks === */
    .block {
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      border: 2px solid rgba(0,0,0,0.15);
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    .block:active {
      transform: scale(0.96);
    }

    .block.stacked {
      width: 100%;
      max-width: 340px;
    }

    .block-icon {
      margin-right: 6px;
    }

    .block.correct {
      border-color: #27ae60;
      box-shadow: 0 0 8px rgba(39, 174, 96, 0.5);
    }

    .block.incorrect {
      border-color: #e74c3c;
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* === Divider === */
    .divider {
      width: 100%;
      max-width: 340px;
      text-align: center;
      color: #5a6a5a;
      font-size: 0.8rem;
      margin: 4px 0;
      font-weight: 600;
    }

    /* === Buttons === */
    .btn-row {
      display: flex;
      gap: 10px;
      margin: 12px 0;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-check { background: #27ae60; color: #fff; }
    .btn-check:hover { background: #219a52; }
    .btn-reset { background: #e67e22; color: #fff; }
    .btn-reset:hover { background: #cf6d17; }
    .btn-hint { background: #3498db; color: #fff; }
    .btn-hint:hover { background: #2980b9; }

    /* === Feedback === */
    .feedback {
      margin: 8px 16px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }

    .feedback:empty { display: none; }
    .feedback.success { background: #d4edda; color: #155724; border: 2px solid #27ae60; }
    .feedback.error { background: #f8d7da; color: #721c24; border: 2px solid #e74c3c; }
    .feedback.info { background: #d1ecf1; color: #0c5460; border: 2px solid #17a2b8; }

    /* === Celebration === */
    .celebration { display: none; flex-direction: column; align-items: center; gap: 6px; }
    .celebration.show { display: flex; }
    .house-icon { font-size: 3.5rem; animation: bounce 0.6s ease infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }

    .score { color: #2c3e50; font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>

<h1>Build a House</h1>
<p class="instructions">
  Tap a block to stack it. Tap a stacked block to remove it.
  Stack all 15 trades in the correct order from bottom to top!
</p>

<div class="stack" id="stack"></div>
<div class="ground-line"></div>

<div class="divider" id="dividerLabel">--- tap a block to stack it ---</div>

<div class="available" id="available"></div>

<div class="btn-row">
  <button class="btn-check" onclick="checkOrder()">Check Order</button>
  <button class="btn-hint" onclick="showHint()">Hint</button>
  <button class="btn-reset" onclick="resetGame()">Reset</button>
</div>

<div class="feedback" id="feedback"></div>

<div class="celebration" id="celebration">
  <div class="house-icon">🏠</div>
  <strong style="font-size:1.2rem; color:#155724;">You built the house!</strong>
</div>

<p class="score" id="score"></p>

<script>
  const TRADES = [
    { name: "Site Preparation & Excavation", color: "#8B6914", icon: "\u{1F6DC}" },
    { name: "Foundation & Concrete",         color: "#7F8C8D", icon: "\u{1F9F1}" },
    { name: "Framing",                       color: "#C0792A", icon: "\u{1FA9A}" },
    { name: "Roofing",                       color: "#6C3483", icon: "\u{1F3E0}" },
    { name: "Windows & Exterior Doors",      color: "#2980B9", icon: "\u{1FA9F}" },
    { name: "Plumbing Rough-In",             color: "#1ABC9C", icon: "\u{1F6BF}" },
    { name: "Electrical Rough-In",           color: "#F39C12", icon: "\u26A1"     },
    { name: "HVAC",                          color: "#5DADE2", icon: "\u2744\uFE0F" },
    { name: "Insulation",                    color: "#E91E8B", icon: "\u{1F9E4}" },
    { name: "Drywall",                       color: "#BDC3C7", icon: "\u{1F9F1}" },
    { name: "Interior Finishes & Paint",     color: "#E74C3C", icon: "\u{1F3A8}" },
    { name: "Flooring",                      color: "#AF601A", icon: "\u{1FA9A}" },
    { name: "Cabinets & Countertops",        color: "#884EA0", icon: "\u{1F5C4}\uFE0F" },
    { name: "Final Plumbing & Electrical",   color: "#17A589", icon: "\u{1F4A1}" },
    { name: "Landscaping & Exterior",        color: "#27AE60", icon: "\u{1F333}" },
  ];

  let attempts = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function createBlock(trade, index) {
    const el = document.createElement("div");
    el.className = "block";
    el.dataset.index = index;
    el.style.background = trade.color;
    el.innerHTML = `<span class="block-icon">${trade.icon}</span>${trade.name}`;
    el.addEventListener("click", () => onBlockTap(el));
    return el;
  }

  function onBlockTap(block) {
    clearFeedback();
    const stack = document.getElementById("stack");
    const available = document.getElementById("available");

    if (block.classList.contains("stacked")) {
      // Remove from stack, return to available pool
      block.classList.remove("stacked", "correct", "incorrect");
      available.appendChild(block);
    } else {
      // Add to top of stack
      block.classList.add("stacked");
      stack.appendChild(block);
    }
    updateDivider();
  }

  function updateDivider() {
    const available = document.getElementById("available");
    const label = document.getElementById("dividerLabel");
    label.textContent = available.children.length > 0
      ? "--- tap a block to stack it ---"
      : "--- all blocks placed ---";
  }

  function getStackedBlocks() {
    return Array.from(document.getElementById("stack").querySelectorAll(".block"));
  }

  function checkOrder() {
    const stacked = getStackedBlocks();
    if (stacked.length === 0) {
      showFeedback("Tap some blocks to stack them first!", "info");
      return;
    }
    if (stacked.length < TRADES.length) {
      showFeedback(`${stacked.length} of ${TRADES.length} placed. Stack them all before checking!`, "info");
      return;
    }

    attempts++;
    let allCorrect = true;

    stacked.forEach((block, i) => {
      if (parseInt(block.dataset.index) === i) {
        block.classList.add("correct");
        block.classList.remove("incorrect");
      } else {
        block.classList.add("incorrect");
        block.classList.remove("correct");
        allCorrect = false;
      }
    });

    if (allCorrect) {
      showFeedback("Perfect! You built the house in the correct order!", "success");
      document.getElementById("celebration").classList.add("show");
      document.getElementById("score").textContent =
        `Completed in ${attempts} ${attempts === 1 ? "attempt" : "attempts"}`;
    } else {
      const correct = stacked.filter((b, i) => parseInt(b.dataset.index) === i).length;
      showFeedback(`${correct} of ${TRADES.length} blocks are in the right position. Keep trying!`, "error");
    }
  }

  function showHint() {
    const stacked = getStackedBlocks();
    for (let i = 0; i < TRADES.length; i++) {
      if (!stacked[i] || parseInt(stacked[i].dataset.index) !== i) {
        showFeedback(`Hint: Position ${i + 1} from the bottom should be "${TRADES[i].name}"`, "info");
        return;
      }
    }
    showFeedback("Everything looks correct!", "success");
  }

  function showFeedback(msg, type) {
    const el = document.getElementById("feedback");
    el.textContent = msg;
    el.className = "feedback " + type;
  }

  function clearFeedback() {
    const el = document.getElementById("feedback");
    el.textContent = "";
    el.className = "feedback";
    document.querySelectorAll(".block").forEach(b => b.classList.remove("correct", "incorrect"));
    document.getElementById("celebration").classList.remove("show");
  }

  function resetGame() {
    clearFeedback();
    attempts = 0;
    document.getElementById("score").textContent = "";
    initGame();
  }

  function initGame() {
    const stack = document.getElementById("stack");
    const available = document.getElementById("available");
    stack.innerHTML = "";
    available.innerHTML = "";

    const shuffled = shuffle(TRADES.map((t, i) => ({ ...t, originalIndex: i })));
    shuffled.forEach(trade => {
      available.appendChild(createBlock(trade, trade.originalIndex));
    });
    updateDivider();
  }

  initGame();
</script>

</body>
</html>
